<style>
:root{
  --bg:#F6F5F1; --surface:#FFFFFF; --ink:#1B1A17; --muted:#6B6860; --line:#E3E0D8; --line-strong:#CFCBC1;
  --it:#1E8A4F; --it-soft:#E2F2E8; --ja:#6A3FD0; --ja-soft:#EEE8FB;
  --good:#1E8A4F; --bad:#C4372F;
  --accent:var(--it); --soft:var(--it-soft);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131311; --surface:#1D1D1A; --ink:#ECEAE4; --muted:#A09D94; --line:#2E2D29; --line-strong:#45433D;
    --it:#5CCB8C; --it-soft:#1A2E22; --ja:#AE91FF; --ja-soft:#251D3B; --good:#5CCB8C; --bad:#FF7F77;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131311; --surface:#1D1D1A; --ink:#ECEAE4; --muted:#A09D94; --line:#2E2D29; --line-strong:#45433D;
  --it:#5CCB8C; --it-soft:#1A2E22; --ja:#AE91FF; --ja-soft:#251D3B; --good:#5CCB8C; --bad:#FF7F77;
  color-scheme:dark;
}
body[data-lang="ja"]{--accent:var(--ja); --soft:var(--ja-soft)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 7rem)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Figtree,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.small{font-size:.88rem}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-inner{max-width:44rem;margin:0 auto;padding:.7rem 1.1rem .5rem}
.langs{display:flex;gap:.4rem}
.langs button{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:.55rem .5rem;font-weight:700;font-size:1.02rem;display:flex;align-items:center;justify-content:center;gap:.5rem}
.langs button i{width:.7rem;height:.7rem;border-radius:50%}
#lang-it i{background:var(--it)} #lang-ja i{background:var(--ja)}
#lang-it[aria-pressed="true"]{border-color:var(--it);background:var(--it-soft)}
#lang-ja[aria-pressed="true"]{border-color:var(--ja);background:var(--ja-soft)}
.sub{display:flex;gap:.2rem;margin-top:.55rem;overflow-x:auto;scrollbar-width:none}
.sub::-webkit-scrollbar{display:none}
.sub button{flex:1;border:0;background:transparent;border-radius:999px;padding:.45rem .8rem;font-weight:600;color:var(--muted);white-space:nowrap}
.sub button[aria-selected="true"]{background:var(--accent);color:var(--surface)}

main{max-width:44rem;margin:0 auto;padding:1rem 1.1rem 4rem}
h1{font-size:1.45rem;line-height:1.25;margin:.4rem 0 .3rem}

.datenav{display:flex;align-items:center;gap:.6rem;margin:.2rem 0 1rem}
.datenav .mid{flex:1;text-align:center;font-weight:600}
.datenav .mid small{display:block;font-weight:500;color:var(--muted);font-size:.8rem}
.arrow{flex:none;width:2.5rem;height:2.5rem;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.25rem;line-height:1}
.arrow:disabled{opacity:.3;cursor:default}

.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:16px;padding:1.4rem;text-align:center}
.empty strong{display:block;margin-bottom:.3rem}

/* Italiano */
.reading{font-family:Literata,Georgia,serif;font-size:1.13rem;line-height:1.85;margin:0 0 1rem}
.it-title{font-family:Literata,Georgia,serif;font-weight:600;font-size:1.55rem}
.w{border-radius:4px;cursor:pointer;transition:background .15s}
.w:hover{background:var(--soft)}
.w.on{background:var(--soft);box-shadow:inset 0 -2px 0 var(--accent)}
.source{font-size:.88rem;color:var(--muted)}
.source a{color:inherit}
.frase{margin-top:1.6rem;background:var(--soft);border-radius:18px;padding:1.1rem 1.2rem}
.frase .label{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.frase-it{font-family:Literata,Georgia,serif;font-size:1.3rem;line-height:1.45;margin:.35rem 0}
.frase-de{font-weight:600;margin:.2rem 0}
.credit{margin-top:2.4rem;font-size:.78rem;color:var(--muted)}

/* Japanisch lesen */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-bottom:.4rem}
.chips{display:flex;gap:.35rem}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:.3rem .8rem;font-weight:600;font-size:.92rem}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.switch{margin-left:auto;display:flex;align-items:center;gap:.4rem;font-size:.92rem;font-weight:500}
.switch input{accent-color:var(--accent);width:1.1rem;height:1.1rem}
.note{font-size:.88rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.55rem .8rem}
.jp-font,.jp,.kbig,.kana-big,.small-jp{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif}
.ja-title{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:1.6rem;margin-bottom:.1rem}
.sent{position:relative;padding:.55rem 2.6rem .55rem 0;border-bottom:1px solid var(--line)}
.jp{font-size:1.45rem;line-height:2.25;margin:0}
.t{border-radius:6px;padding:0 1px;cursor:pointer}
.t:hover{background:var(--soft)}
.t.seen{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--accent) 55%,transparent)}
rt{font-size:.5em;color:var(--muted)}
.de-btn{position:absolute;right:0;top:.85rem;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:.72rem;font-weight:700;padding:.2rem .4rem;color:var(--muted)}
.de-btn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.jp-de{margin:.1rem 0 .2rem;color:var(--muted)}
.big-btn{display:block;width:100%;margin-top:1.4rem;border:0;border-radius:14px;padding:.95rem;background:var(--accent);color:var(--surface);font-weight:700;font-size:1.02rem}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;transition:opacity .2s}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:40rem;margin:0 auto;max-height:82vh;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:1.2rem 1.2rem calc(1.4rem + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .22s ease;box-shadow:0 -10px 40px rgba(0,0,0,.15)}
.sheet.open .scrim{opacity:1}
.sheet.open .panel{transform:none}
.close{position:sticky;top:0;float:right;border:0;background:var(--bg);border-radius:50%;width:2.1rem;height:2.1rem;font-size:1.1rem;color:var(--muted);margin:-.3rem -.3rem 0 .5rem}
.sheet-head{display:flex;align-items:flex-start;gap:.8rem}
.sheet-head .grow{flex:1;min-width:0}
.big{font-size:2rem;font-weight:700;line-height:1.2;word-break:break-word}
.reading-line{color:var(--muted);font-size:1.05rem}
.tag{display:inline-block;margin-top:.3rem;font-size:.78rem;font-weight:600;color:var(--accent);background:var(--soft);border-radius:999px;padding:.1rem .55rem}
.trans{font-size:1.25rem;font-weight:600;margin:.8rem 0 .3rem}
.sec{margin-top:1.1rem}
.sec h3{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 .35rem}
.star{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:50%;width:2.6rem;height:2.6rem;font-size:1.3rem;line-height:1;color:var(--muted)}
.star[aria-pressed="true"]{color:#E2A400;border-color:#E2A400}
.kcard{display:flex;gap:.9rem;align-items:flex-start;background:var(--bg);border-radius:14px;padding:.8rem;margin-bottom:.5rem}
.kcard .kbig{font-size:2.6rem;line-height:1;color:var(--accent)}
.kcard p{margin:.3rem 0 0}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:.3rem 0}
.arrow-btn{border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:.4rem .9rem;font-weight:600}
.example{margin-top:.6rem;background:var(--soft);border-radius:14px;padding:.7rem .9rem}
.example p{margin:.15rem 0}
.small-jp{font-size:1.2rem}

/* Listen */
.list-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem}
.wordlist{list-style:none;margin:.6rem 0 0;padding:0}
.wordlist li{display:flex;align-items:center;gap:.8rem;padding:.75rem 0;border-bottom:1px solid var(--line)}
.wl-main{flex:1;min-width:0}
.wl-main strong,.wl-main ruby{font-size:1.12rem}
.wl-de{margin-top:.1rem}

/* Trainer */
.trainer-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:1.4rem 1.2rem;text-align:center;margin-top:.6rem}
.kana-big{font-size:5.5rem;line-height:1.15;color:var(--accent)}
.options{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:1rem}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:.8rem;font-size:1.2rem;font-weight:700}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 15%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--surface))}
.feedback{min-height:1.5rem;margin:.7rem 0 0;font-weight:600}
.stats-sum{display:flex;gap:1rem;flex-wrap:wrap;margin:1.4rem 0 .5rem;font-size:.9rem}
.stats-sum b{font-size:1.1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.6rem,1fr));gap:.3rem}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:1.15rem;border:1px solid var(--line);background:var(--surface);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;padding:0}
.cell.b0{background:color-mix(in srgb,var(--bad) 22%,var(--surface));border-color:transparent}
.cell.b1{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.cell.b2{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.cell.b3{background:color-mix(in srgb,var(--accent) 38%,var(--surface));border-color:transparent}
.cell.b4{background:color-mix(in srgb,var(--accent) 60%,var(--surface));border-color:transparent;color:var(--surface)}
.cell.b5{background:var(--accent);color:var(--surface);border-color:transparent}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:.5rem}
.legend span{display:flex;align-items:center;gap:.3rem}
.legend i{width:.8rem;height:.8rem;border-radius:3px;display:inline-block}

.kanji-card .kana-big{font-size:6rem}
.details{text-align:left;margin-top:.8rem}
.details .trans{margin-top:0}
.row2{display:flex;gap:.6rem;margin-top:1rem}
.row2 button{flex:1;border:0;border-radius:14px;padding:.85rem;font-weight:700;font-size:1rem}
.again{background:color-mix(in srgb,var(--bad) 15%,var(--surface));color:var(--bad)}
.knew{background:var(--accent);color:var(--surface)}
.reveal{border:1.5px solid var(--accent);background:transparent;color:var(--accent);border-radius:14px;padding:.75rem 1.4rem;font-weight:700;margin-top:.8rem}

.pad-wrap{margin-top:1.2rem}
.pad{position:relative;width:100%;max-width:340px;aspect-ratio:1;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.pad svg,.pad canvas{position:absolute;inset:0;width:100%;height:100%}
.pad canvas{touch-action:none}
.pad .gridlines line{stroke:var(--line-strong);stroke-width:.5;stroke-dasharray:2 2}
.pad .guide path{fill:none;stroke:var(--line-strong);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.pad .anim path{fill:none;stroke:var(--accent);stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.pad .anim text{font-size:7px;fill:var(--muted);font-family:Figtree,sans-serif}
.pad-btns{display:flex;gap:.4rem;justify-content:center;margin-top:.6rem;flex-wrap:wrap}
.pad-btns button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.45rem .8rem;font-weight:600;font-size:.92rem}
.pad-btns button[aria-pressed="false"]{color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);background:var(--ink);color:var(--bg);padding:.7rem 1.1rem;border-radius:16px;font-weight:500;transition:transform .25s ease;z-index:50;max-width:min(90vw,30rem);text-align:center}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-lang="it">
<header class="top">
  <div class="top-inner">
    <div class="langs">
      <button id="lang-it" aria-pressed="true"><i></i>Italiano</button>
      <button id="lang-ja" aria-pressed="false"><i></i>日本語</button>
    </div>
    <nav class="sub" id="sub" role="tablist"></nav>
  </div>
</header>
<main>
  <section id="it-text"></section>
  <section id="it-words" hidden></section>
  <section id="ja-kana" hidden></section>
  <section id="ja-read" hidden></section>
  <section id="ja-kanji" hidden></section>
  <section id="ja-words" hidden></section>
</main>
<div class="sheet" id="sheet" hidden>
  <div class="scrim" id="scrim"></div>
  <div class="panel" role="dialog" aria-modal="true">
    <button class="close" id="sheet-close" aria-label="Schließen">✕</button>
    <div id="sheet-body"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
/* ---------- Helfer ---------- */
const $=s=>document.querySelector(s);
function el(tag,props,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v===false||v==null) continue;
    if(k==="class") e.className=v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?"":v);
  }
  for(const c of kids.flat(Infinity)){
    if(c==null||c===false) continue;
    e.append(c.nodeType?c:document.createTextNode(String(c)));
  }
  return e;
}
function ls(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function ss(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let toastT;
function toast(msg,ms){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),ms||2200)}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmtDay=new Intl.DateTimeFormat("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const fmtDate=s=>{const [y,m,d]=s.split("-").map(Number);return fmtDay.format(new Date(y,m-1,d))};
const safeLink=u=>/^https?:\/\//i.test(u||"")?u:null;
const KANJI=/[\u4e00-\u9fff]/;
const arr=x=>Array.isArray(x)?x.join(", "):(x||"–");
function put(box,...nodes){box.replaceChildren(...nodes.flat(Infinity).filter(x=>x!=null&&x!==false))}
function empty(title,text){return el("div",{class:"empty"},el("strong",{},title),el("span",{class:"muted"},text))}

/* ---------- Daten ---------- */
function bases(){
  const b=[],h=location.hostname;
  if(h.endsWith(".github.io")){
    const owner=h.split(".")[0];
    const first=location.pathname.split("/").filter(Boolean)[0];
    const repo=first&&!first.includes(".")?first:h;
    b.push(`https://raw.githubusercontent.com/${owner}/${repo}/main/data/`);
  }
  b.push("data/");
  return b;
}
async function getData(path){
  for(const base of bases()){
    try{
      const r=await fetch(base+path+(base.startsWith("http")?"?t="+Math.floor(Date.now()/60000):""),{cache:"no-store"});
      if(r.ok){const j=await r.json();ss("sp-cache:"+path,j);return j}
    }catch(e){}
  }
  return ls("sp-cache:"+path,null);
}
let IDX={it:[],ja:[]},idxP=null;
const loadIndex=()=>idxP||(idxP=getData("index.json").then(j=>{if(j)IDX={it:j.it||[],ja:j.ja||[]};return IDX}));
const DAYS={it:{},ja:{}},POS={it:0,ja:0};
async function loadDay(lang){
  await loadIndex();
  const dates=IDX[lang];
  if(!dates.length) return null;
  POS[lang]=Math.max(0,Math.min(POS[lang],dates.length-1));
  const d=dates[POS[lang]];
  if(!DAYS[lang][d]) DAYS[lang][d]=await getData(`${lang}/${d}.json`);
  return DAYS[lang][d];
}
function dateNav(lang,rerender){
  const dates=IDX[lang],i=POS[lang];
  return el("div",{class:"datenav"},
    el("button",{class:"arrow","aria-label":"Vorheriger Tag",disabled:i>=dates.length-1,onclick:()=>{POS[lang]++;rerender()}},"‹"),
    el("div",{class:"mid"},fmtDate(dates[i]),el("small",{},i===0?"Neueste Seite":`${i} ${i===1?"Tag":"Tage"} zurück`)),
    el("button",{class:"arrow","aria-label":"Nächster Tag",disabled:i<=0,onclick:()=>{POS[lang]--;rerender()}},"›"));
}

/* ---------- Wortlisten ---------- */
const W={it:ls("sp-words-it",{}),ja:ls("sp-words-ja",{})};
function toggleWord(lang,key,item){
  if(W[lang][key]) delete W[lang][key]; else W[lang][key]=item;
  ss("sp-words-"+lang,W[lang]);
  const on=!!W[lang][key];
  toast(on?"Zur Liste hinzugefügt":"Aus der Liste entfernt",1400);
  return on;
}
function starBtn(on,toggle){
  const b=el("button",{class:"star"});
  const set=v=>{b.textContent=v?"★":"☆";b.setAttribute("aria-pressed",String(v));b.setAttribute("aria-label",v?"Aus der Liste entfernen":"Zur Liste hinzufügen")};
  set(on);b.onclick=()=>set(toggle());
  return b;
}

/* ---------- Sheet ---------- */
function openSheet(...nodes){
  const s=$("#sheet");$("#sheet-body").replaceChildren(...nodes.flat().filter(Boolean));
  s.hidden=false;$(".panel").scrollTop=0;
  requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add("open")));
}
function closeSheet(){
  const s=$("#sheet");s.classList.remove("open");
  document.querySelectorAll(".w.on").forEach(x=>x.classList.remove("on"));
  setTimeout(()=>{if(!s.classList.contains("open"))s.hidden=true},230);
}
$("#scrim").onclick=closeSheet;$("#sheet-close").onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

/* ---------- Italiano ---------- */
function tappable(text,onTap){
  const out=[];
  String(text||"").split(/(\p{L}+['’]?)/u).forEach((part,i)=>{
    if(!part) return;
    if(i%2===1){const s=el("span",{class:"w"},part);s.onclick=()=>{document.querySelectorAll(".w.on").forEach(x=>x.classList.remove("on"));s.classList.add("on");onTap(part)};out.push(s)}
    else out.push(document.createTextNode(part));
  });
  return out;
}
async function renderItText(){
  const box=$("#it-text");
  if(!box.childElementCount) put(box,el("p",{class:"muted"},"Lädt …"));
  const day=await loadDay("it");
  if(!day){put(box,empty("Noch keine Tagesseite","Die erste Seite erscheint, sobald die Automatik auf GitHub gelaufen ist."));return}
  const g=day.glossario||{};
  const look=w=>{const k=w.toLowerCase().replace(/’/g,"'");return g[k]||g[k.replace(/'$/,"")]||g[k+"'"]||null};
  const tap=w=>openItWord(w,look(w),day.datum);
  const f=day.frase||{};
  const link=day.fonte&&safeLink(day.fonte.link);
  put(box,
    dateNav("it",renderItText),
    el("h1",{class:"it-title"},tappable(day.titolo,tap)),
    (day.testo||[]).map(p=>el("p",{class:"reading"},tappable(p,tap))),
    day.fonte&&day.fonte.titolo?el("p",{class:"source"},"Zum Nachlesen: ",link?el("a",{href:link,target:"_blank",rel:"noopener"},day.fonte.titolo):day.fonte.titolo):null,
    f.it?el("section",{class:"frase"},
      el("div",{class:"label"},f.tipo||"Frase del giorno"),
      el("p",{class:"frase-it"},tappable(f.it,tap)),
      el("p",{class:"frase-de"},f.de||""),
      f.spiegazione?el("p",{class:"small muted"},f.spiegazione):null):null,
    el("p",{class:"credit"},"Text von einer KI (Gemini) nach aktuellen Schlagzeilen geschrieben. Übersetzungen können Fehler enthalten."));
}
function openItWord(w,e,date){
  const lemma=e&&e.lemma?e.lemma:w;
  const key=lemma.toLowerCase();
  openSheet(
    el("div",{class:"sheet-head"},
      el("div",{class:"grow"},el("div",{class:"big"},w),
        lemma.toLowerCase()!==w.toLowerCase()?el("div",{class:"reading-line"},"Grundform: ",el("strong",{},lemma)):null),
      starBtn(!!W.it[key],()=>toggleWord("it",key,{w:lemma,form:w,de:e?e.de:"",info:e?e.info:"",d:date}))),
    e?el("p",{class:"trans"},e.de):el("p",{class:"muted"},"Für dieses Wort gibt es leider keinen Eintrag."),
    e&&e.info?el("p",{class:"muted"},e.info):null);
}

/* ---------- Wortlisten-Ansicht ---------- */
function renderWords(lang){
  const box=$(`#${lang}-words`);
  const items=Object.entries(W[lang]).sort((a,b)=>(b[1].d||"").localeCompare(a[1].d||"")||a[0].localeCompare(b[0]));
  const head=el("div",{class:"list-head"},el("h1",{},lang==="it"?"Vokabeln":"Wörter"),el("span",{class:"muted"},`${items.length} gespeichert`));
  if(!items.length){put(box,head,empty("Noch nichts gespeichert","Tippe beim Lesen auf ein Wort und dann auf den Stern ☆."));return}
  put(box,head,el("ul",{class:"wordlist"},items.map(([k,it])=>el("li",{},
    el("div",{class:"wl-main"},
      lang==="ja"&&it.r&&it.r!==it.w?el("ruby",{class:"jp-font"},it.w,el("rt",{},it.r)):el("strong",{class:lang==="ja"?"jp-font":""},it.w),
      el("div",{class:"wl-de"},it.de||""),
      (it.info||it.art)?el("div",{class:"muted small"},it.info||it.art):null),
    el("button",{class:"star","aria-pressed":"true","aria-label":"Aus der Liste entfernen",onclick:()=>{delete W[lang][k];ss("sp-words-"+lang,W[lang]);renderWords(lang);toast("Entfernt",1200)}},"★")))));
}

/* ---------- Japanisch: Lesen ---------- */
const JL=Object.assign({level:"N5",hist:[],done:{}},ls("sp-ja-level",{}));
let furi=ls("sp-furi",true),tapped=new Set(),tappedKey="";
const ORDER=["N5","N4","N3"];
async function renderJaRead(){
  const box=$("#ja-read");
  if(!box.childElementCount) put(box,el("p",{class:"muted"},"Lädt …"));
  const day=await loadDay("ja");
  if(!day){put(box,empty("Noch keine Tagesseite","Die ersten Texte erscheinen, sobald die Automatik auf GitHub gelaufen ist."));return}
  const lv=day.levels||{};
  let level=JL.level,note=null;
  if(!lv[level]){const avail=ORDER.filter(l=>lv[l]);if(!avail.length){put(box,empty("Kein Text","Für diesen Tag gibt es keinen japanischen Text."));return}
    level=avail.reduce((best,l)=>Math.abs(ORDER.indexOf(l)-ORDER.indexOf(JL.level))<Math.abs(ORDER.indexOf(best)-ORDER.indexOf(JL.level))?l:best);
    note=`Für ${JL.level} gibt es an diesem Tag keinen Text. Du siehst ${level}.`}
  const t=lv[level],key=day.datum+"|"+level;
  if(tappedKey!==key){tappedKey=key;tapped=new Set()}
  const sents=(t.saetze||[]).map((s,si)=>{
    const p=el("p",{class:"jp"});
    (s.tokens||[]).forEach((tk,ti)=>{
      if(!tk||!tk.s) return;
      if(tk.p){p.append(tk.s);return}
      const id=si+":"+ti;
      const span=el("span",{class:"t"+(tapped.has(id)?" seen":"")},furi&&KANJI.test(tk.s)&&tk.r?el("ruby",{},tk.s,el("rt",{},tk.r)):tk.s);
      span.onclick=()=>{tapped.add(id);span.classList.add("seen");openJaTok(tk,t,day.datum)};
      p.append(span);
    });
    const de=el("p",{class:"jp-de",hidden:true},s.de||"");
    const btn=el("button",{class:"de-btn","aria-pressed":"false","aria-label":"Übersetzung zeigen"},"DE");
    btn.onclick=()=>{de.hidden=!de.hidden;btn.setAttribute("aria-pressed",String(!de.hidden))};
    return el("div",{class:"sent"},p,btn,de);
  });
  const ql=t.quelle&&safeLink(t.quelle.link);
  put(box,
    el("div",{class:"toolbar"},
      el("div",{class:"chips"},ORDER.map(l=>el("button",{class:"chip","aria-pressed":String(l===JL.level),onclick:()=>{JL.level=l;ss("sp-ja-level",JL);renderJaRead()}},l))),
      el("label",{class:"switch"},el("input",{type:"checkbox",checked:furi,onchange:e=>{furi=e.target.checked;ss("sp-furi",furi);renderJaRead()}}),"Furigana")),
    dateNav("ja",renderJaRead),
    note?el("p",{class:"note"},note):null,
    el("h1",{class:"ja-title"},t.titel||""),
    t.titel_de?el("p",{class:"muted",style:"margin-top:0"},t.titel_de):null,
    sents,
    t.quelle&&t.quelle.titel?el("p",{class:"source"},"Nach dieser Nachricht: ",ql?el("a",{href:ql,target:"_blank",rel:"noopener"},t.quelle.titel):t.quelle.titel):null,
    el("button",{class:"big-btn",onclick:()=>finishJa(day,level,t)},"Fertig gelesen"),
    el("p",{class:"credit"},"Tippe auf ein Wort für Übersetzung und Erklärung, auf „DE“ für die Satzübersetzung. Nach „Fertig gelesen“ passt sich das Niveau an: Brauchst du kaum Hilfe, kommen schwerere Texte. Texte von einer KI (Gemini), ohne Gewähr."));
}
function finishJa(day,level,t){
  const key=day.datum+"|"+level;
  if(JL.done[key]){toast("Diesen Text hast du schon abgeschlossen.");return}
  const words=(t.saetze||[]).reduce((n,s)=>n+(s.tokens||[]).filter(x=>x&&x.s&&!x.p).length,0)||1;
  const r=tapped.size/words;
  JL.done[key]=1;
  JL.hist.push({l:level,r:Math.round(r*100)/100});JL.hist=JL.hist.slice(-40);
  let msg=`Geschafft! Du hast ${tapped.size} von ${words} Wörtern nachgeschlagen.`;
  const recent=JL.hist.filter(h=>h.l===level).slice(-3),i=ORDER.indexOf(level);
  if(level===JL.level&&recent.length>=3){
    const avg=recent.reduce((a,h)=>a+h.r,0)/3;
    if(avg<0.15&&i<ORDER.length-1){JL.level=ORDER[i+1];JL.hist.push({l:"x",r:0});msg=`Stark! Du brauchst kaum noch Hilfe. Ab jetzt bekommst du ${JL.level}-Texte.`}
    else if(avg>0.5&&i>0){JL.level=ORDER[i-1];JL.hist.push({l:"x",r:0});msg=`Das war viel Neues. Zurück auf ${JL.level}, bis es leichter fällt.`}
  }
  ss("sp-ja-level",JL);toast(msg,4200);renderJaRead();
}
function openJaTok(tk,t,date){
  const kd=t.kanji||{};
  const chars=[...new Set(tk.s.match(/[\u4e00-\u9fff]/g)||[])];
  const ex=tk.bsp&&tk.bsp.jp?el("div",{class:"example",hidden:true},el("p",{class:"small-jp"},tk.bsp.jp),tk.bsp.r?el("p",{class:"muted small"},tk.bsp.r):null,el("p",{},tk.bsp.de||"")):null;
  let exBtn=null;
  if(ex){exBtn=el("button",{class:"arrow-btn"},"→ In einem anderen Satz");exBtn.onclick=()=>{ex.hidden=!ex.hidden;exBtn.textContent=ex.hidden?"→ In einem anderen Satz":"← Beispiel ausblenden"}}
  openSheet(
    el("div",{class:"sheet-head"},
      el("div",{class:"grow"},el("div",{class:"big jp-font"},tk.s),
        tk.r&&tk.r!==tk.s?el("div",{class:"reading-line jp-font"},tk.r):null,
        tk.art?el("span",{class:"tag"},tk.art):null),
      starBtn(!!W.ja[tk.s],()=>toggleWord("ja",tk.s,{w:tk.s,r:tk.r||"",de:tk.de||"",art:tk.art||"",d:date}))),
    el("p",{class:"trans"},tk.de||"–"),
    tk.erkl?el("div",{class:"sec"},el("h3",{},"Warum steht das hier?"),el("p",{style:"margin:0"},tk.erkl)):null,
    ex?el("div",{class:"sec"},exBtn,ex):null,
    chars.length?el("div",{class:"sec"},el("h3",{},"Kanji"),chars.map(ch=>{
      const d=kd[ch]||N5[ch];
      return el("div",{class:"kcard"},el("div",{class:"kbig"},ch),el("div",{},
        el("strong",{},d?d.bed:"Keine Erklärung vorhanden"),
        d?el("div",{class:"muted small jp-font"},"On: "+arr(d.on)+"　Kun: "+arr(d.kun)):null,
        d&&d.verwendung?el("p",{class:"small"},d.verwendung):null,
        N5[ch]?el("button",{class:"link",onclick:()=>{closeSheet();goKanji(ch)}},"Im Kanji-Trainer üben →"):null));
    })):null);
}

/* ---------- Japanisch: Kana-Trainer ---------- */
const KH="あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん";
const KK="アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン";
const KR="a i u e o ka ki ku ke ko sa shi su se so ta chi tsu te to na ni nu ne no ha hi fu he ho ma mi mu me mo ya yu yo ra ri ru re ro wa wo n".split(" ");
const DH="がぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽ";
const DK="ガギグゲゴザジズゼゾダヂヅデドバビブベボパピプペポ";
const DR="ga gi gu ge go za ji zu ze zo da ji zu de do ba bi bu be bo pa pi pu pe po".split(" ");
const KS=Object.assign({mode:"h",dak:false,st:{}},ls("sp-kana",{}));
let kCur=null,kLast=null,kBusy=false;
function kanaPool(){
  const out=[],add=(chars,ro)=>[...chars].forEach((c,i)=>out.push([c,ro[i]]));
  if(KS.mode!=="k"){add(KH,KR);if(KS.dak)add(DH,DR)}
  if(KS.mode!=="h"){add(KK,KR);if(KS.dak)add(DK,DR)}
  return out;
}
const weight=st=>st?Math.pow(2,5-Math.min(5,st.b)):24;
function pickWeighted(pool,stats,avoid){
  const ws=pool.map(p=>p[0]===avoid&&pool.length>1?0:weight(stats[p[0]]));
  let x=Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<pool.length;i++){x-=ws[i];if(x<=0)return pool[i]}
  return pool[pool.length-1];
}
function statsGrid(chars,stats,current,onPick){
  return el("div",{class:"grid"},chars.map(c=>{
    const st=stats[c];
    return el("button",{class:"cell"+(st?" b"+st.b:"")+(c===current?" cur":""),title:st?`${st.ok} richtig, ${st.no} falsch`:"noch nicht geübt",onclick:onPick?()=>onPick(c):null},c);
  }));
}
function legend(){
  return el("div",{class:"legend"},
    el("span",{},el("i",{style:"background:color-mix(in srgb,var(--bad) 22%,var(--surface))"}),"zuletzt falsch"),
    el("span",{},el("i",{style:"background:color-mix(in srgb,var(--accent) 22%,var(--surface))"}),"wird besser"),
    el("span",{},el("i",{style:"background:var(--accent)"}),"sicher"),
    el("span",{},el("i",{style:"border:1px solid var(--line);background:var(--surface)"}),"neu"));
}
function summary(chars,stats){
  let sure=0,prac=0,neu=0;
  chars.forEach(c=>{const s=stats[c];if(!s)neu++;else if(s.b>=3)sure++;else prac++});
  return el("div",{class:"stats-sum"},el("span",{},el("b",{},sure)," sicher"),el("span",{},el("b",{},prac)," üben"),el("span",{},el("b",{},neu)," neu"));
}
function renderKana(){
  const box=$("#ja-kana");
  const modes=[["h","Hiragana"],["k","Katakana"],["b","Beide"]];
  const pool=kanaPool();
  if(!kBusy) kCur=pickWeighted(pool,KS.st,kLast&&kLast[0]);
  const opts=new Set([kCur[1]]);
  for(const o of shuffle(pool.map(p=>p[1]).filter(r=>r!==kCur[1]))){if(opts.size>=4)break;opts.add(o)}
  const fb=el("p",{class:"feedback"});
  const buttons=shuffle([...opts]).map(o=>{const b=el("button",{class:"opt"},o);b.onclick=()=>answerKana(o,buttons,fb);return b});
  put(box,
    el("div",{class:"toolbar"},
      el("div",{class:"chips"},modes.map(([m,l])=>el("button",{class:"chip","aria-pressed":String(KS.mode===m),onclick:()=>{KS.mode=m;ss("sp-kana",KS);kBusy=false;renderKana()}},l))),
      el("label",{class:"switch"},el("input",{type:"checkbox",checked:KS.dak,onchange:e=>{KS.dak=e.target.checked;ss("sp-kana",KS);kBusy=false;renderKana()}}),"mit ゛゜")),
    el("div",{class:"trainer-card"},el("div",{class:"kana-big"},kCur[0]),el("div",{class:"options"},buttons),fb),
    summary(pool.map(p=>p[0]),KS.st),
    statsGrid(pool.map(p=>p[0]),KS.st,kCur[0]),
    legend(),
    el("p",{class:"credit"},"Zeichen, die du falsch hattest, kommen öfter dran. Sicher heißt: mehrmals hintereinander richtig."));
}
function answerKana(o,buttons,fb){
  if(kBusy) return; kBusy=true;
  const ok=o===kCur[1];
  const st=KS.st[kCur[0]]||{b:0,ok:0,no:0};
  if(ok){st.b=Math.min(5,st.b+1);st.ok++}else{st.b=0;st.no++}
  KS.st[kCur[0]]=st;ss("sp-kana",KS);
  buttons.forEach(b=>{if(b.textContent===kCur[1])b.classList.add("right");else if(b.textContent===o)b.classList.add("wrong")});
  fb.textContent=ok?"Richtig!":`${kCur[0]} ist „${kCur[1]}“`;
  fb.style.color=ok?"var(--good)":"var(--bad)";
  setTimeout(()=>{kLast=kCur;kBusy=false;if(!$("#ja-kana").hidden)renderKana()},ok?650:1600);
}

  const hex=ch.codePointAt(0).toString(16).padStart(5,"0");
  for(const u of [`https://raw.githubusercontent.com/KanjiVG/kanjivg/master/kanji/${hex}.svg`,`https://cdn.jsdelivr.net/gh/KanjiVG/kanjivg@master/kanji/${hex}.svg`]){

  const guideBtn=el("button",{"aria-pressed":"true"},"Vorlage");
  const clear=el("button",{},"Löschen");
  const ink=setupCanvas(canvas);
  play.onclick=()=>{
    if(!strokes) return;
    anim.replaceChildren();
    strokes.forEach((d,i)=>{
      const p=svgEl("path",{d});anim.append(p);
      const L=p.getTotalLength();
      p.style.strokeDasharray=L;p.style.strokeDashoffset=L;
      const start=p.getPointAtLength(0);
      const num=svgEl("text",{x:start.x-6,y:start.y-2});num.textContent=i+1;num.style.opacity=0;anim.append(num);
      p.getBoundingClientRect();
      p.style.transition=`stroke-dashoffset .5s ease ${i*0.6}s`;
      num.style.transition=`opacity .2s ${i*0.6}s`;
      requestAnimationFrame(()=>{p.style.strokeDashoffset="0";num.style.opacity=1});
    });
  };
  guideBtn.onclick=()=>{const on=guide.style.visibility==="hidden";guide.style.visibility=on?"visible":"hidden";guideBtn.setAttribute("aria-pressed",String(on))};
  clear.onclick=()=>{ink.clear();anim.replaceChildren()};
  loadStrokes(ch).then(ds=>{
    strokes=ds;ds.forEach(d=>guide.append(svgEl("path",{d})));
    play.disabled=false;
    status.textContent=`${ds.length} ${ds.length===1?"Strich":"Striche"}. Tippe auf ▶ und zeichne dann mit dem Finger nach.`;
  }).catch(()=>{status.textContent="Strichfolge konnte nicht geladen werden. Bist du online? Zeichnen geht trotzdem."});
  return el("div",{class:"pad-wrap"},pad,status,el("div",{class:"pad-btns"},play,guideBtn,clear));
}
function setupCanvas(c){
  const ctx=c.getContext("2d");let drawing=false,last=null,ready=false;
  const size=()=>{
    const r=c.getBoundingClientRect();if(!r.width) return;
    const dpr=window.devicePixelRatio||1;
    c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineCap="round";ctx.lineJoin="round";
    ctx.lineWidth=Math.max(6,r.width/30);
    ctx.strokeStyle=ctx.fillStyle=getComputedStyle(document.body).getPropertyValue("--ink").trim()||"#222";
    ready=true;
  };
  const pos=e=>{const r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  c.addEventListener("pointerdown",e=>{
    if(!ready) size();
    e.preventDefault();c.setPointerCapture(e.pointerId);drawing=true;last=pos(e);
    ctx.beginPath();ctx.arc(last[0],last[1],ctx.lineWidth/2,0,Math.PI*2);ctx.fill();
  });
  c.addEventListener("pointermove",e=>{
    if(!drawing) return;
    const p=pos(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;
  });
  const stop=()=>{drawing=false};
  c.addEventListener("pointerup",stop);c.addEventListener("pointercancel",stop);
  requestAnimationFrame(size);
  return {clear:()=>{const r=c.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height)}};
}

/* ---------- Navigation ---------- */
const TABS={it:[["text","Text"],["words","Vokabeln"]],ja:[["kana","Kana"],["read","Lesen"],["kanji","Kanji"],["words","Wörter"]]};
const NAV=Object.assign({lang:"it",it:"text",ja:"read"},ls("sp-nav",{}));
const RENDER={"it-text":renderItText,"it-words":()=>renderWords("it"),"ja-kana":renderKana,"ja-read":renderJaRead,"ja-kanji":renderKanji,"ja-words":()=>renderWords("ja")};
function show(){
  const lang=NAV.lang,tab=NAV[lang];
  document.body.dataset.lang=lang;
  $("#lang-it").setAttribute("aria-pressed",String(lang==="it"));
  $("#lang-ja").setAttribute("aria-pressed",String(lang==="ja"));
  $("#sub").replaceChildren(...TABS[lang].map(([id,label])=>el("button",{role:"tab","aria-selected":String(id===tab),onclick:()=>{NAV[lang]=id;show()}},label)));
  document.querySelectorAll("main>section").forEach(s=>{s.hidden=s.id!==`${lang}-${tab}`});
  ss("sp-nav",NAV);
  closeSheet();
  window.scrollTo(0,0);
  RENDER[`${lang}-${tab}`]();
}
$("#lang-it").onclick=()=>{NAV.lang="it";show()};
$("#lang-ja").onclick=()=>{NAV.lang="ja";show()};
show();
})();
